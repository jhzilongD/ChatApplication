server:
  port: 10010

spring:
  application:
    name: GateWay
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:18375
    gateway:
      httpclient:
        connect-timeout: 60000 # ???????????
        response-timeout: 60000 # ???????????
      # ????
      # ??????
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:10010"
            allowedMethods:
              - "GET"
              - "POST"
              - "PUT"
              - "DELETE"
              - "OPTIONS"
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 36000
      routes:
        #        - id: query_router
        #          uri: https://www.baidu.com
        #          predicates:
        #            - Query=green
        #            - After=2026-01-20T17:42:47.789-07:00[America/Denver]
        #
        #        - id: cookie_route
        #          uri: https://qq.com
        #          predicates:
        #            - Cookie=chocolate, ch.p
        #
        #        - id: header_route
        #          uri: https://m.weibo.cn/
        #          predicates:
        #            - Header=X-Request-Id, \d+

        # 登陆认证服务
        - id: AuthenticationService
#          uri: lb://AuthenticationService
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/user/**
            # - After=2026-01-20T17:42:47.789-07:00[America/Denver]
          filters:
            - AddRequestHeader=X-Request-Source, InfiniteChat-GateWay
            - AddResponseHeader=X-Response-Source, InfiniteChat-GateWay

        # 实时通信服务
        - id: RealTimeCommunicationService
          uri: lb://RealTimeCommunicationService
          # uri: http://localhost:8083
          predicates:
            - Path=/api/v1/message/**

        # Netty长链接服务 （为什么LB的方式会出错？）
        - id: NettyService
          uri: ws://127.0.0.1:9001
#          uri: ws://NettyService
          predicates:
            - Path=/api/v1/netty
